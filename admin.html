<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەدمین پەنێل - تێشتا دادی</title>
    
    <!-- هاوردەکرنا فۆنتێ Zain یێ گرۆڤر و فۆنتێ Cairo یێ بێ کێشە -->
    <link href="https://fonts.googleapis.com/css2?family=Zain:wght@700;800;900&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-color: #9E121E; 
            --accent-color: #DCAE5B; 
            --bg-app: #FAF4F4; 
            --card-bg: #ffffff;
            --text-dark: #000000; 
            --text-light: #2C3532; 
            --border-accent: rgba(158, 18, 30, 0.12);
            --tab-bg: #F5EAEB;
            --app-font: 'Zain', 'Cairo', sans-serif;
        }

        .dark-theme {
            --primary-color: #C1121C; 
            --accent-color: #E6BC73; 
            --bg-app: #0C110F; 
            --card-bg: #151D1A;
            --text-dark: #FFFFFF; 
            --text-light: #D1DFD8;
            --border-accent: rgba(193, 18, 28, 0.18);
            --tab-bg: #222E2A;
        }

        body, button, input, select, textarea, span, p, h1, h2, h3, h4, h5, h6, div, label {
            font-family: var(--app-font) !important;
            letter-spacing: normal !important; 
            font-variant-ligatures: common-ligatures !important; 
            text-rendering: optimizeLegibility !important; 
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-dark);
            padding: 20px 10px;
        }

        .admin-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 2px solid var(--border-accent);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(158, 18, 30, 0.15);
        }

        .header-title {
            text-align: center;
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-accent);
            padding-bottom: 10px;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .admin-form input, .admin-form select, .admin-form textarea {
            width: 100%;
            padding: 11px;
            background-color: var(--tab-bg);
            border: 1.5px solid var(--border-accent);
            color: var(--text-dark) !important;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
        }

        .admin-form textarea {
            resize: none;
            height: 60px;
        }

        .apply-btn {
            background-color: var(--primary-color);
            color: #ffffff !important;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(158, 18, 30, 0.2);
        }

        .admin-cat-toggle-box {
            background-color: var(--tab-bg);
            border: 1.5px solid var(--border-accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .setting-group-title {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .admin-cat-toggle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .cat-toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: var(--text-dark) !important;
            cursor: pointer;
        }

        .cat-toggle-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .img-preview-box {
            width: 100%;
            aspect-ratio: 1/1 !important; 
            border-radius: 10px;
            overflow: hidden;
            background: #eee;
            margin-bottom: 6px;
            border: 1.5px solid var(--border-accent);
            display: none;
        }

        .img-preview-box img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        .admin-dishes-title {
            font-size: 1.15rem;
            color: var(--text-dark) !important;
            margin: 18px 0 10px 0;
            border-top: 2px dashed var(--border-accent);
            padding-top: 14px;
            font-weight: bold;
        }

        .admin-dishes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .admin-dish-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: var(--tab-bg);
            border: 1.5px solid var(--border-accent);
            border-radius: 10px;
        }

        .admin-dish-info {
            font-size: 0.95rem;
            color: var(--text-dark) !important;
            max-width: 50%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-dish-actions {
            display: flex;
            gap: 4px; 
        }

        .admin-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.25rem; 
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-action-btn:hover {
            background-color: rgba(45, 66, 57, 0.1);
        }

        #accessDenied {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
            gap: 15px;
        }
    </style>
</head>
<body class="dark-theme">

    <div id="accessDenied">
        <h2 style="font-size: 1.5rem; color: var(--primary-color);">ڕێپێنەدراو | Access Denied</h2>
        <p style="color: var(--text-light);">هیڤییە پاسوۆردێ ئەدمینی لێبدە بۆ چوونەژوورێ</p>
        <button class="apply-btn" type="button" onclick="askPassword()" style="max-width: 200px;">چوونەژوورێ</button>
    </div>

    <div class="admin-container" id="adminPanelMain" style="display: none;">
        <h2 class="header-title" id="adminModalTitle">ئەدمین پەنێل - تێشتا دادی</h2>

        <div class="admin-cat-toggle-box">
            <div class="setting-group-title">ڕێکخستنا ناڤێ مینیۆیێ (سەر تاسکباری)</div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="customBrandName" placeholder="ناڤەکێ نوو لێرە بنڤیسە...">
                <button class="apply-btn" type="button" id="saveBrandNameBtn" style="width: auto; padding: 10px 16px; font-size: 0.85rem;">پاشکەوت</button>
            </div>
        </div>
        
        <div class="admin-cat-toggle-box">
            <div class="setting-group-title" id="adminCatToggleTitle">ڕێکخستنا پشکان (دیارکرن/شاردنەوە)</div>
            <div class="admin-cat-toggle-grid" id="catToggleGrid"></div>
        </div>

        <form class="admin-form" id="addDishForm" onsubmit="event.preventDefault();">
            <div class="img-preview-box" id="imgPreviewBox">
                <img id="imgPreview" src="" alt="Preview">
            </div>

            <input type="text" id="newDishName" placeholder="ناڤێ خوارنێ بنڤیسە" required>
            <input type="text" id="newDishPrice" placeholder="سعر ل دەڤ خۆ بدانە (نموونە: ٥,٠٠0 د.ع)" required>
            <textarea id="newDishDesc" placeholder="وەسفەکا کورت بنڤیسە" required></textarea>
            
            <select id="newDishCat" required>
                <option value="germ" id="optGerm">گەرم</option>
                <option value="sar" id="optSar">سار</option>
                <option value="shirin" id="optShirin">شیریناهی</option>
                <option value="vexwarin" id="optVex">ڤەخوارن</option>
                <option value="wejbe" id="optWejbe">وجبە</option>
                <option value="ewaza" id="optEwaza">عەوازە</option>
            </select>

            <input type="file" id="newDishImgFile" accept="image/*" style="display: none;">
            <button class="apply-btn" type="button" id="uploadImgBtn" style="background-color: var(--tab-bg); color: var(--text-dark) !important; border: 1.5px solid var(--border-accent); margin-bottom: 10px;">هەڵبژارتنا وێنەی ژ مۆبایلێ 📸</button>

            <div style="display: flex; gap: 8px;">
                <button class="apply-btn" type="button" id="saveDishBtn">زێدەکرن</button>
                <button class="apply-btn" type="button" id="cancelEditBtn" style="background-color: var(--text-light); display: none;">پاشگەزبوون</button>
            </div>
        </form>

        <div class="admin-dishes-title" id="adminListTitle">لیستا خوارنان</div>
        <div class="admin-dishes-list" id="adminDishesList"></div>
    </div>

    <script>
        // --- ⚙️ ڕێکخستنا فایەربەیسێ ---
        const firebaseConfig = {
            apiKey: "AIzaSyDfFAiTQjGGb5bnnN_GYxamix34Dpybsd0",
            authDomain: "dade-data.firebaseapp.com",
            databaseURL: "https://dade-data-default-rtdb.firebaseio.com", // لینکێ فەرمی یێ ئەمریکا کو دروستە
            projectId: "dade-data",
            storageBucket: "dade-data.firebasestorage.app",
            messagingSenderId: "1044178637456",
            appId: "1:1044178637456:web:5ba2bc75511dcabab5be15",
            measurementId: "G-KQ2VVQL4N8"
        };

        let db = null;
        let isFirebaseActive = false;

        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseActive = true;
            } catch (error) {
                console.error("Firebase Initialization Failed:", error);
            }
        }

        const ADMIN_PASSWORD = "dade@2026";
        
        const defaultDishes = [
            { id: 1, name: "هێک ب سجووقێ", price: "٦,٢٥٠ د.ع", desc: "دوو هێکێن گوندێ دگەل سجووقا حەلال یا خۆمالی.", cat: "germ", img: "", order: 1 },
            { id: 2, name: "سینییا دادی یا مەزن", price: "١٥,٠٠٠ د.ع", desc: "هەمەجۆریا پەنێر، هنگڤین، قەیماخ و زەیتوونان.", cat: "sar", img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400&h=400&fit=crop", order: 2 },
            { id: 3, name: "مەنەمەنا دادی", price: "٥,٠٠٠ د.ع", desc: "تەماتە، بیبەر و هێکێن تێکەل ب پەنیری ڤە.", cat: "germ", img: "", order: 3 },
            { id: 4, name: "قەیماخ و هنگڤین", price: "٦,٠٠٠ د.ع", desc: "قەیماخێ سرۆشتی دگەل هنگڤینێ چیا یێ پاقژ.", cat: "shirin", img: "https://images.unsplash.com/photo-1584736286279-4172579b29cc?w=400&h=400&fit=crop", order: 4 },
            { id: 5, name: "کولێرا تنوورێ", price: "١,٥٠٠ د.ع", desc: "کولێرا تەڕ و گەرم ب کەرە و کونجی ڤە.", cat: "germ", img: "", order: 5 },
            { id: 6, name: "چایا ب هێلێ", price: "١,٠٠٠ د.ع", desc: "چایا ڕەش یا دەمکری ل سەر پشکۆیێ گەرم.", cat: "vexwarin", img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400&h=400&fit=crop", order: 6 },
            { id: 7, name: "وجبا دادی یا تایبەت", price: "١٢,٥٠٠ د.ع", desc: "وجبەکا تەمام پێکهاتی ژ هێک، سجووق، پەنێر، هنگڤین و چایا دەمکری.", cat: "wejbe", img: "", order: 7 },
            { id: 8, name: "عەوازە هنگڤین و کەرێ", price: "٣,٥٠٠ د.ع", desc: "کەرەیا کێوی دگەل هنگڤینێ چیایی یێ دەڤەرێ بۆ زێدەکرنێ.", cat: "ewaza", img: "", order: 8 },
            { id: 9, name: "هێک ب قەلیا گۆشتی", price: "٧,٥٠٠ د.ع", desc: "قەلیا گۆشتێ بەرخی یێ کوردی دگەل هێکان.", cat: "germ", img: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?w=400&h=400&fit=crop", order: 9 },
            { id: 10, name: "پەنێر ب گواێز", price: "٤,٥٠٠ د.ع", desc: "پەنێرێ سپی یێ چێکری دگەل مغزێ گویزێن تەڕ.", cat: "sar", img: "https://images.unsplash.com/photo-1552763443-1589487d27e5?w=400&h=400&fit=crop", order: 10 },
            { id: 11, name: "کەرە و دۆشاب یا مالێ", price: "٤,٠٠٠ د.ع", desc: "کەرەیا کێوی دگەل دۆشابا تری یا ب تام دگەل گونییا ڕەسەن.", cat: "shirin", img: "", order: 11 },
            { id: 12, name: "ئاڤا پرتەقالێ یا تازە", price: "٣,٥٠٠ د.ع", desc: "ئاڤا پرتەقالێ سروشتی یا سارد بێی شەکر.", cat: "vexwarin", img: "https://images.unsplash.com/photo-1613478223719-2ab802602423?w=400&h=400&fit=crop", order: 12 },
            { id: 13, name: "وجبا سپێدێ یا مۆدێرن", price: "٩,٠٠٠ د.ع", desc: "وجبەکا گەرم ژ هێلکە و قارچک و پۆستێن سەفەری.", cat: "wejbe", img: "", order: 13 },
            { id: 14, name: "زەیتوون ب بیبەرێ", price: "٢,٥٠٠ د.ع", desc: "زەیتوونێن کەسک و ڕەش دگەل زەیتا زەیتوونێ یا پاقژ.", cat: "sar", img: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?w=400&h=400&fit=crop", order: 14 },
            { id: 15, name: "قەهوا قەزوانا چیایی", price: "٢,٥٠٠ د.ع", desc: "قەهوا قەزوانا کوردی یا دەمکری ب شیری.", cat: "vexwarin", img: "", order: 15 }
        ];

        let dishes = JSON.parse(localStorage.getItem('t_dade_dishes')) || defaultDishes;
        let categoriesState = { germ: true, sar: true, shirin: true, vexwarin: true, wejbe: true, ewaza: true };
        let editingDishId = null;
        let currentUploadedImgData = "";

        function askPassword() {
            const pwd = prompt("پاسوۆردێ ئەدمینی لێبدە:");
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('accessDenied').style.display = 'none';
                document.getElementById('adminPanelMain').style.display = 'block';
                
                renderAdminList();
                updateToggles();
                syncDataFromFirebase();
            } else {
                alert("پاسوۆرد شاشە!");
            }
        }

        window.moveToTop = function(id) {
            const index = dishes.findIndex(d => d.id === id);
            if (index > 0) {
                const [item] = dishes.splice(index, 1);
                dishes.unshift(item); 
                saveAndRefresh();
            }
        };

        window.moveUp = function(id) {
            const index = dishes.findIndex(d => d.id === id);
            if (index > 0) {
                const temp = dishes[index];
                dishes[index] = dishes[index - 1];
                dishes[index - 1] = temp;
                saveAndRefresh();
            }
        };

        function renderAdminList() {
            const adminDishesList = document.getElementById('adminDishesList');
            adminDishesList.innerHTML = '';

            dishes.forEach((dish, index) => {
                const row = document.createElement('div');
                row.className = 'admin-dish-row';
                row.innerHTML = `
                    <div class="admin-dish-info">
                        <strong>${index + 1}. ${dish.name}</strong> (${dish.price})
                    </div>
                    <div class="admin-dish-actions">
                        <button class="admin-action-btn" type="button" onclick="moveToTop(${dish.id})" title="Move to Top">🔝</button>
                        <button class="admin-action-btn" type="button" onclick="moveUp(${dish.id})" title="Move Up">⬆️</button>
                        <button class="admin-action-btn" type="button" onclick="editDish(${dish.id})" title="Edit">✏️</button>
                        <button class="admin-action-btn" type="button" onclick="deleteDish(${dish.id})" title="Delete">🗑️</button>
                    </div>
                `;
                adminDishesList.appendChild(row);
            });
        }

        window.toggleCategoryState = function(categoryKey, isChecked) {
            categoriesState[categoryKey] = isChecked;
            localStorage.setItem('t_dade_categories', JSON.stringify(categoriesState));
            if (isFirebaseActive && db) {
                try {
                    db.ref('settings/categoriesState').set(categoriesState).catch(err => {
                        console.error("Firebase Toggle Error:", err);
                    });
                } catch(e) {
                    console.error("Toggle crash caught:", e);
                }
            }
        };

        const saveBrandNameBtn = document.getElementById('saveBrandNameBtn');
        saveBrandNameBtn.addEventListener('click', () => {
            const customName = document.getElementById('customBrandName').value.trim();
            if (customName) {
                localStorage.setItem('t_dade_brand_name', customName);
                if (isFirebaseActive && db) {
                    try {
                        db.ref('settings/brandName').set(customName).catch(err => {
                            console.error("Firebase Brand Error:", err);
                        });
                    } catch(e) {
                        console.error("Brand save crash caught:", e);
                    }
                }
                alert("ناڤ ب سەرکەفتی هاتە گۆڕین!");
            } else {
                localStorage.removeItem('t_dade_brand_name');
                if (isFirebaseActive && db) {
                    try {
                        db.ref('settings/brandName').remove().catch(err => {
                            console.error("Firebase Brand Remove Error:", err);
                        });
                    } catch(e) {
                        console.error("Brand remove crash caught:", e);
                    }
                }
                alert("ناڤ ل سەر بنەڕەت هاتە نووکرن!");
            }
        });

        const uploadImgBtn = document.getElementById('uploadImgBtn');
        const newDishImgFile = document.getElementById('newDishImgFile');
        const imgPreviewBox = document.getElementById('imgPreviewBox');
        const imgPreview = document.getElementById('imgPreview');

        uploadImgBtn.addEventListener('click', () => {
            newDishImgFile.click();
        });

        newDishImgFile.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const size = 500; 
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        const min = Math.min(img.width, img.height);
                        const sx = (img.width - min) / 2;
                        const sy = (img.height - min) / 2;
                        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
                        imgPreview.src = compressedBase64;
                        imgPreviewBox.style.display = 'block';
                        currentUploadedImgData = compressedBase64;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        window.deleteDish = function(id) {
            if (confirm("تۆ پشتڕاستی دکەی بۆ ژێبرنا ڤێ خوارنێ؟")) {
                dishes = dishes.filter(d => d.id !== id);
                saveAndRefresh();
                if (editingDishId === id) {
                    resetAdminForm();
                }
            }
        };

        window.editDish = function(id) {
            const dish = dishes.find(d => d.id === id);
            if (!dish) return;

            editingDishId = id;
            document.getElementById('newDishName').value = dish.name;
            document.getElementById('newDishPrice').value = dish.price;
            document.getElementById('newDishDesc').value = dish.desc;
            document.getElementById('newDishCat').value = dish.cat;
            
            currentUploadedImgData = dish.img || "";
            if (dish.img) {
                imgPreview.src = dish.img;
                imgPreviewBox.style.display = 'block';
            } else {
                imgPreviewBox.style.display = 'none';
            }

            document.getElementById('saveDishBtn').textContent = "پاشکەوتکرن";
            document.getElementById('cancelEditBtn').style.display = 'block';
        };

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            resetAdminForm();
        });

        function resetAdminForm() {
            editingDishId = null;
            document.getElementById('addDishForm').reset();
            imgPreviewBox.style.display = 'none';
            currentUploadedImgData = "";
            newDishImgFile.value = "";
            document.getElementById('saveDishBtn').textContent = "زێدەکرن";
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        const saveDishBtn = document.getElementById('saveDishBtn');
        saveDishBtn.addEventListener('click', () => {
            const name = document.getElementById('newDishName').value.trim();
            const price = document.getElementById('newDishPrice').value.trim();
            const desc = document.getElementById('newDishDesc').value.trim();
            const cat = document.getElementById('newDishCat').value;
            const img = currentUploadedImgData; 

            if (!name || !price || !desc) {
                alert("بکەرەم، هیڤییە هەمی بەشێن سەرەکی تەمام بکە!");
                return;
            }

            if (editingDishId) {
                const index = dishes.findIndex(d => d.id === editingDishId);
                if (index !== -1) {
                    dishes[index] = { id: editingDishId, name, price, desc, cat, img };
                }
            } else {
                const newDish = { id: Date.now(), name, price, desc, cat, img };
                dishes.push(newDish);
            }

            saveAndRefresh();
            resetAdminForm();
        });

        // سیستەمێ پاراستنا لۆکال ژ باگ و تەقینێن فایەربەیسێ (Fail-safe Try-Catch)
        function saveAndRefresh() {
            localStorage.setItem('t_dade_dishes', JSON.stringify(dishes));
            
            if (isFirebaseActive && db) {
                try {
                    db.ref('dishes').set(dishes).then(() => {
                        console.log("Data synced to Firebase successfully.");
                    }).catch(err => {
                        console.error("Firebase Write Promise Error:", err);
                        alert("فایەربەیس ڕێگریێ دکەت (تیک نیشانا Publish د بن ل سەر فایەربەیسێ بکە): " + err.message);
                    });
                } catch(e) {
                    console.error("Firebase Sync Crash Caught:", e);
                }
            }
            renderAdminList();
        }

        function syncDataFromFirebase() {
            if (isFirebaseActive && db) {
                try {
                    // تاقیکردنەوەیا ڕاستەوخۆ یا گرێدانا داتابەیسێ ل سەر مۆبایلێ
                    db.ref('.info/connected').on('value', (snap) => {
                        if (snap.val() === true) {
                            console.log("Connected to Firebase Realtime Database!");
                        } else {
                            console.log("Disconnected from Firebase.");
                        }
                    });

                    db.ref('dishes').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            let parsedDishes = [];
                            if (Array.isArray(data)) {
                                parsedDishes = data.filter(item => item !== null);
                            } else if (typeof data === 'object') {
                                parsedDishes = Object.values(data).filter(item => item !== null);
                            }
                            
                            if (parsedDishes.length > 0) {
                                dishes = parsedDishes;
                                renderAdminList();
                            } else {
                                db.ref('dishes').set(defaultDishes).catch(e => console.error(e));
                            }
                        } else {
                            db.ref('dishes').set(defaultDishes).catch(e => console.error(e));
                        }
                    }, (err) => {
                        console.error("Firebase dishes listen error:", err);
                    });

                    db.ref('settings').on('value', (snapshot) => {
                        const settings = snapshot.val();
                        if (settings) {
                            if (settings.brandName) {
                                document.getElementById('customBrandName').value = settings.brandName;
                            }
                            if (settings.categoriesState) {
                                categoriesState = settings.categoriesState;
                            }
                            updateToggles();
                        }
                    }, (err) => {
                        console.error("Firebase settings listen error:", err);
                    });
                } catch(e) {
                    console.error("Firebase initialization sync crash caught:", e);
                }
            }
        }

        function updateToggles() {
            const catToggleGrid = document.getElementById('catToggleGrid');
            catToggleGrid.innerHTML = `
                <label class="cat-toggle-label" for="toggle_germ">
                    <input type="checkbox" id="toggle_germ" ${categoriesState.germ ? 'checked' : ''} onchange="toggleCategoryState('germ', this.checked)"> گەرم
                </label>
                <label class="cat-toggle-label" for="toggle_sar">
                    <input type="checkbox" id="toggle_sar" ${categoriesState.sar ? 'checked' : ''} onchange="toggleCategoryState('sar', this.checked)"> سار
                </label>
                <label class="cat-toggle-label" for="toggle_shirin">
                    <input type="checkbox" id="toggle_shirin" ${categoriesState.shirin ? 'checked' : ''} onchange="toggleCategoryState('shirin', this.checked)"> شیریناهی
                </label>
                <label class="cat-toggle-label" for="toggle_vexwarin">
                    <input type="checkbox" id="toggle_vexwarin" ${categoriesState.vexwarin ? 'checked' : ''} onchange="toggleCategoryState('vexwarin', this.checked)"> ڤەخوارن
                </label>
                <label class="cat-toggle-label" for="toggle_wejbe">
                    <input type="checkbox" id="toggle_wejbe" ${categoriesState.wejbe ? 'checked' : ''} onchange="toggleCategoryState('wejbe', this.checked)"> وجبە
                </label>
                <label class="cat-toggle-label" for="toggle_ewaza">
                    <input type="checkbox" id="toggle_ewaza" ${categoriesState.ewaza ? 'checked' : ''} onchange="toggleCategoryState('ewaza', this.checked)"> عەوازە
                </label>
            `;
        }
    </script>
